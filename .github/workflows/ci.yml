# CI workflow for ZenithPortfolio KMP project
# Runs on pushes to develop and PRs targeting develop or main

name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Android: tests, lint, and debug build
  # ──────────────────────────────────────────────
  android:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Run shared module unit tests (commonTest compiled for Android/JVM)
      - name: Run shared module tests
        run: ./gradlew :shared:testDebugUnitTest

      # Run Android lint checks
      - name: Run lint
        run: ./gradlew :composeApp:lintDebug

      # Build debug APK
      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug

      # Upload debug APK as artifact
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Upload lint results
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: composeApp/build/reports/lint-results-debug.html
          retention-days: 14

  # ──────────────────────────────────────────────
  # iOS: framework build and shared tests
  # ──────────────────────────────────────────────
  ios:
    name: iOS Framework Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Run shared module tests compiled for iOS Simulator
      - name: Run shared iOS simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test

      # Build the iOS debug framework for the simulator
      - name: Build iOS debug framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      # Upload the iOS framework as artifact
      - name: Upload iOS debug framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-framework
          path: shared/build/bin/iosSimulatorArm64/debugFramework/
          retention-days: 14
