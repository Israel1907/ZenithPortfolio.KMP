# Release workflow for ZenithPortfolio KMP project
# Triggered on pushes to main — builds release artifacts for Android and iOS

name: Release

on:
  push:
    branches: [main]

# Only one release build at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Android release APK
  # ──────────────────────────────────────────────
  android-release:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run tests before building release
      - name: Run shared module tests
        run: ./gradlew :shared:testReleaseUnitTest

      # Build release APK
      - name: Assemble release APK
        run: ./gradlew :composeApp:assembleRelease

      # Upload release APK
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 30

  # ──────────────────────────────────────────────
  # iOS release framework
  # ──────────────────────────────────────────────
  ios-release:
    name: iOS Release Framework
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build release frameworks for both iOS targets
      - name: Build iOS release framework (arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Build iOS release framework (simulator arm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64

      # Upload device framework (arm64 — the one used for App Store builds)
      - name: Upload iOS release framework (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-framework-arm64
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 30

      # Upload simulator framework
      - name: Upload iOS release framework (simulator)
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-framework-simulator
          path: shared/build/bin/iosSimulatorArm64/releaseFramework/
          retention-days: 30
